[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codraft"
version = "0.1.0"
description = "Generate building floor plans from a brief and check them against jurisdiction-specific building codes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
# Nothing here is required. The core generates DXF, IFC and SVG with the
# standard library alone; these only add convenience.
dev = ["pytest>=8"]

[project.scripts]
codraft = "codraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codraft = ["codes/registry/*.json", "codes/rules/*.json"]
