    opts:[["WA","Western Australia"],["VIC","Victoria"],["NSW","New South Wales"],["QLD","Queensland"]],
    set:(v)=>{A.state=v}, say:v=>({WA:"Western Australia",VIC:"Victoria",NSW:"New South Wales",QLD:"Queensland"}[v]) },
  { id:"zone", q:"What's the R-code on the title? In WA it decides the setbacks and how much of the block you can cover.",
    when:()=>A.state==="WA", opts:[["R20","R20"],["R25","R25"],["R30","R30"],["R40","R40"],["R60","R60"]],
    set:v=>{A.zone=v}, say:v=>v },
  { id:"lot", q:"How big is the block? Frontage first, then depth.", kind:"lot",
    set:v=>{A.lotW=v[0];A.lotD=v[1]}, say:v=>`${v[0]/1000} m × ${v[1]/1000} m` },
  { id:"storeys", q:"How many floors?",
    opts:[["1","Single storey"],["2","Two storeys"],["3","Three storeys"]],
    set:v=>{A.storeys=+v}, say:v=>v==="1"?"Single storey":v+" storeys" },
  { id:"bedrooms", q:"How many bedrooms?", opts:[["2","2"],["3","3"],["4","4"],["5","5"]],
    set:v=>{A.bedrooms=+v}, say:v=>v+" bedrooms" },
  { id:"bathrooms", q:"And bathrooms? The ensuite counts as one.",
    opts:[["1","1"],["2","2"],["3","3"]], set:v=>{A.bathrooms=+v}, say:v=>v+" bathrooms" },
  { id:"garage", q:"Garage?", opts:[["2","Double"],["1","Single"],["0","None"]],
    set:v=>{A.garage=+v}, say:v=>({"2":"Double garage","1":"Single garage","0":"No garage"}[v]) },
  { id:"extras", q:"Anything else? Pick as many as you want, then press Done.", kind:"multi",
    opts:[["theatre","Theatre"],["study","Study"],["alfresco","Alfresco"],["pool","Pool"]],
    set:v=>{v.forEach(k=>A[k]=true)},
    say:v=>v.length?v.map(k=>({theatre:"Theatre",study:"Study",alfresco:"Alfresco",pool:"Pool"}[k])).join(", "):"Nothing extra" },
];

let step = 0, multi = new Set();
const feed = document.getElementById("cd-feed");
const dock = document.getElementById("cd-dock");

function bubble(who, html) {
  const d = document.createElement("div");
  d.className = "cd-msg cd-" + who;
  d.innerHTML = html;
  feed.appendChild(d);
  d.scrollIntoView({ behavior:"smooth", block:"end" });
  return d;
}

function nextStep() {
  while (step < STEPS.length && STEPS[step].when && !STEPS[step].when()) step++;
  if (step >= STEPS.length) return finish();
  const s = STEPS[step];
  bubble("bot", esc(s.q));
  dock.innerHTML = "";
  multi = new Set();

  if (s.kind === "lot") {
    dock.innerHTML = `<div class="cd-lotrow">
      <label class="cd-f"><span class="cd-lbl">Frontage (m)</span><input id="cd-lw" type="number" inputmode="decimal" value="15" step="0.1" min="4"></label>
      <label class="cd-f"><span class="cd-lbl">Depth (m)</span><input id="cd-ld" type="number" inputmode="decimal" value="28" step="0.1" min="6"></label>
      <button class="cd-go" id="cd-lotok">Use this block</button></div>`;
    document.getElementById("cd-lotok").onclick = () => {
      const w = Math.round(parseFloat(document.getElementById("cd-lw").value) * 1000);
      const d = Math.round(parseFloat(document.getElementById("cd-ld").value) * 1000);
      if (!(w > 0 && d > 0)) return;
      answer(s, [w, d]);
    };
    return;
  }

  s.opts.forEach(([v, label]) => {
    const b = document.createElement("button");
    b.className = "cd-opt"; b.textContent = label; b.dataset.v = v;
    b.onclick = () => {
      if (s.kind === "multi") {
        multi.has(v) ? multi.delete(v) : multi.add(v);
        b.classList.toggle("cd-on", multi.has(v));
      } else answer(s, v);
    };
    dock.appendChild(b);
  });
  if (s.kind === "multi") {
    const done = document.createElement("button");
    done.className = "cd-go"; done.textContent = "Done";
    done.onclick = () => answer(s, [...multi]);
    dock.appendChild(done);
  }
}

function answer(s, v) {
  bubble("you", esc(s.say(v)));
  s.set(v);
  step++;
  dock.innerHTML = "";
  setTimeout(nextStep, 220);
}

function finish() {
  dock.innerHTML = "";
  bubble("bot", "Designing it now, to the rules for that state…");
  setTimeout(() => {
    const out = design(A);
    if (out.error) { bubble("bot", esc(out.error)); return restart(); }
    showResult(out);
    restart();
  }, 350);
}

function restart() {
  dock.innerHTML = `<button class="cd-go" id="cd-again">Start again</button>`;
  document.getElementById("cd-again").onclick = () => {
    Object.assign(A, { state:null, zone:"R20", lotW:null, lotD:null, storeys:null,
      bedrooms:null, bathrooms:2, garage:2, theatre:false, study:false, alfresco:false, pool:false });
    step = 0; feed.innerHTML = ""; nextStep();
  };
}

function showResult(out) {
  const s = out.stats, plan = out.plan;
  const sheets = plan.storeys.map((_, i) =>
    `<div class="cd-sheet">${renderPlan(out, i)}</div>`).join("");

  const rows = plan.storeys.flat().map(c => {
    const r = out.clear(c);
    return { name:c.r.name, a:r.w*r.h, w:Math.min(r.w,r.h), l:Math.max(r.w,r.h) };
  }).sort((a,b)=>b.a-a.a);

  const checks = [];
  const push = (ok, txt) => checks.push({ ok, txt });
  push(s.cover <= s.maxCover, `Site cover ${(s.cover*100).toFixed(1)}% against ${(s.maxCover*100).toFixed(0)}% allowed — ${s.code}`);
  // Two limbs. The area is measured as one rectangle and can be decided; the
  // minimum dimension is a figure the packs do not carry, so it is reported
  // as measured-and-undecided (null) rather than folded into the tick. This
  // used to be (lot − footprint) against the area alone, which ticked green
  // on a lot whose only open ground was two 1 m ribbons down the boundaries.
  push(s.outdoor >= s.minOutdoor,
       `${s.outdoor.toFixed(0)} m² outdoor living at the ${s.outdoorWhere}, ${s.minOutdoor} m² wanted — measured as one rectangle outside the street setback`);
  push(null,
       `That area is ${s.outdoorMinDim} mm across at its narrowest. The R-Codes set a minimum dimension too and that figure is not encoded here, so this limb is unchecked — an area met by a long thin strip does not comply.`);
  push(s.ceiling >= 2400, `Ceilings ${s.ceiling} mm (28 courses) — the NCC wants 2400`);
  push(true, `${s.construction === "double_brick" ? "Double brick, 230 mm cavity over a 90 mm leaf" : "Brick veneer, 240 mm external over a 90 mm frame"}`);
  if (plan.pool) push(true, "Pool barrier 1200 mm with a 900 mm non-climbable zone — AS 1926.1");
  if (plan.poolNote) push(false, plan.poolNote);
  out.notes.forEach(n => push(false, n));

  bubble("bot", `Here it is — <b>${(s.gfa/1e6).toFixed(0)} m²</b> over
    ${plan.storeys.length} floor${plan.storeys.length>1?"s":""} on a
    ${(plan.lot.area/1e6).toFixed(0)} m² block in ${esc(s.state)}${s.zone?" ("+s.zone+")":""}.`);

  const card = document.createElement("div");
  card.className = "cd-result";
  card.innerHTML = `
    ${sheets}
    <div class="cd-stats">
      <div><span class="cd-k">Floor area</span><span class="cd-v">${(s.gfa/1e6).toFixed(0)} m²</span></div>
      <div><span class="cd-k">Site cover</span><span class="cd-v">${(s.cover*100).toFixed(1)}%</span></div>
      <div><span class="cd-k">Open space</span><span class="cd-v">${s.outdoor.toFixed(0)} m²</span></div>
      <div><span class="cd-k">Ceilings</span><span class="cd-v">${s.ceiling} mm</span></div>
    </div>
    <h3 class="cd-h3">Checked</h3>
    <ul class="cd-checks">${checks.map(c =>
      `<li class="${c.ok===null?"cd-unk":c.ok?"cd-ok":"cd-bad"}">${esc(c.txt)}</li>`).join("")}</ul>
    <h3 class="cd-h3">Rooms</h3>
    <ul class="cd-rooms">${rows.map(r =>
      `<li><span>${esc(r.name)}</span><span class="cd-num">${(r.a/1e6).toFixed(1)} m² · ${r.w}×${r.l}</span></li>`).join("")}</ul>
    <p class="cd-warn"><b>This is a concept, not a permit set.</b> It is drawn to the
      planning controls and the parts of the NCC that can be read off a plan. It has no
      structural design, no energy assessment, no site survey. A registered building
      surveyor certifies, an engineer does the footings. Setbacks shown are the state
      default — a Local Development Plan for your estate may override them.</p>`;
  feed.appendChild(card);
  card.scrollIntoView({ behavior:"smooth", block:"start" });
}

bubble("bot", "I'll design a house for your block. A few questions about the land and what you want in it, then you'll get a plan drawn to the rules for your state.");
nextStep();

</script>
