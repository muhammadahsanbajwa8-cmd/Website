name: Nightly build and deploy

# The whole point of the nightly run: it keeps /today/ correct, refreshes the
# holiday data, and publishes next year's pages on its own as the range rolls
# forward. Nothing here needs a human.
on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC daily
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Keeps repeat builds fast and means an upstream outage degrades to
      # yesterday's data rather than to nothing.
      - name: Restore API cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: nager-cache-${{ github.run_id }}
          restore-keys: nager-cache-

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check the output is not empty
        run: |
          test -f dist/index.html
          test -f dist/sitemap.xml
          echo "pages: $(find dist -name '*.html' | wc -l)"

      # Stops a build that would put ads where policy forbids them, or that
      # still carries sample listings, from reaching the deploy step. Config
      # that is merely not filled in yet — the placeholder domain before you
      # own one — is reported as TODO and does not fail the run, or the site
      # could never go live in the first place.
      - name: AdSense policy check
        run: npm run adsense:check

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Publishes to GitHub Pages, which is free and needs no card.
  #
  # This used to be opt-in because a GitHub Pages *project* site is served from
  # a sub-folder (user.github.io/Repo/) while the site linked everything from
  # the domain root — the first page loaded and the stylesheet and every link
  # 404'd. The generator now takes its mount point from `url` in
  # site.config.mjs and prefixes every address, so a sub-folder is a supported
  # home rather than a broken one, and this runs by default.
  #
  # One thing still has to be done by hand, once:
  #   Settings → Pages → Source: GitHub Actions
  # Until that is set this job fails with "Pages site not found" — the build
  # above still succeeds, and nothing else is wrong.
  #
  # Hosting on Cloudflare Pages or Netlify instead? They build from the
  # repository themselves, so switch this off with a repository variable:
  #   Settings → Secrets and variables → Actions → Variables → DEPLOY_TARGET=off
  deploy:
    needs: build
    if: vars.DEPLOY_TARGET != 'off'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# ---------------------------------------------------------------------------
# Deploying somewhere else instead? Replace the `deploy` job above.
#
# Cloudflare Pages:
#   - uses: cloudflare/wrangler-action@v3
#     with:
#       apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
#       accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
#       command: pages deploy dist --project-name=holiday-board
#
# Netlify:
#   - run: npx --yes netlify-cli deploy --dir=dist --prod
#     env:
#       NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
#       NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
# ---------------------------------------------------------------------------
